// =============================================================================
//  Counter-Strike 2 - 1v1 Configuration
//  Version 2.0 (CS2 port)            Original CS:GO config (C) 2019 Denial
//
//  Install : Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\1v1.cfg
//  Run     : start a private match as host, open the console, type   exec 1v1
// =============================================================================


// -----------------------------------------------------------------------------
//  Remove bots  (set the quota first, otherwise bots are re-added after the kick)
// -----------------------------------------------------------------------------
    bot_quota                   0;
    bot_kick;


// -----------------------------------------------------------------------------
//  Voice chat  (voice disabled - change sv_voiceenable to 1 to allow it)
// -----------------------------------------------------------------------------
    sv_voiceenable              0;
    sv_alltalk                  0;
    sv_full_alltalk             0;
    sv_deadtalk                 0;


// -----------------------------------------------------------------------------
//  Weapons
// -----------------------------------------------------------------------------
    mp_weapons_allow_map_placed 0;     // no weapons lying on the map
    mp_weapons_allow_zeus       1;
    mp_taser_recharge_time      3;
    mp_molotovusedelay          0;
    mp_t_default_melee          0;     // no knife (stops knife-out running)
    mp_ct_default_melee         0;
    // sv_infinite_ammo is cheat-protected in CS2 - use the "infammo" toggle below.


// -----------------------------------------------------------------------------
//  Pre-game
// -----------------------------------------------------------------------------
    mp_autoteambalance          0;
    mp_limitteams               0;
    mp_timelimit                0;
    mp_endwarmup_player_count   2;


// -----------------------------------------------------------------------------
//  Game settings
// -----------------------------------------------------------------------------
    mp_freezetime               3;
    mp_roundtime                60;    // minutes (60 is the maximum)
    mp_roundtime_defuse         60;    // CS2 uses these on bomb / hostage maps
    mp_roundtime_hostage        60;    //   instead of mp_roundtime
    mp_maxrounds                16;
    mp_respawn_immunitytime     0;
    mp_round_restart_delay      3;
    mp_free_armor               1;     // 1 = kevlar, 2 = kevlar + helmet
    mp_match_can_clinch         1;
    mp_overtime_enable          0;


// -----------------------------------------------------------------------------
//  Half time / end of match
// -----------------------------------------------------------------------------
    mp_halftime                 1;
    mp_halftime_duration        10;
    mp_match_end_restart        1;



// =============================================================================
//  TOGGLES
// =============================================================================

//  Headshot only
    alias headshot              "hs_on";
    alias hs_on                 "mp_damage_headshot_only 1; alias headshot hs_off; say [1v1] Headshots only: ON; mp_restartgame 3";
    alias hs_off                "mp_damage_headshot_only 0; alias headshot hs_on; say [1v1] Headshots only: OFF; mp_restartgame 3";

//  Overtime
    alias overtime              "ot_on";
    alias ot_on                 "mp_overtime_enable 1; alias overtime ot_off; say [1v1] Overtime: ON; mp_restartgame 3";
    alias ot_off                "mp_overtime_enable 0; alias overtime ot_on; say [1v1] Overtime: OFF; mp_restartgame 3";

//  Map-placed weapons  (both command names toggle the same setting)
    alias mapweapons            "wp_on";
    alias groundweapons         "wp_on";
    alias wp_on                 "mp_weapons_allow_map_placed 1; alias mapweapons wp_off; alias groundweapons wp_off; say [1v1] Map weapons: ON; mp_restartgame 3";
    alias wp_off                "mp_weapons_allow_map_placed 0; alias mapweapons wp_on; alias groundweapons wp_on; say [1v1] Map weapons: OFF; mp_restartgame 3";

//  Infinite reserve ammo  (needs sv_cheats 1 in CS2 - this also enables cheat
//  commands for everyone on the server while it is ON)
    alias infammo               "ammo_on";
    alias ammo_on               "sv_cheats 1; sv_infinite_ammo 2; alias infammo ammo_off; say [1v1] Infinite ammo: ON (sv_cheats enabled)";
    alias ammo_off              "sv_infinite_ammo 0; sv_cheats 0; alias infammo ammo_on; say [1v1] Infinite ammo: OFF";



// =============================================================================
//  MATCH CONTROL
// =============================================================================

    alias endwarmup             "mp_warmup_end";

    alias startgame             "mp_restartgame 3";
    alias startmatch            "mp_restartgame 3";
    alias begin                 "mp_restartgame 3";

    alias restartgame           "mp_restartgame 3";
    alias restartmatch          "mp_restartgame 3";

    alias pausegame             "mp_pause_match";
    alias pausematch            "mp_pause_match";

    alias unpausegame           "mp_unpause_match";
    alias unpausematch          "mp_unpause_match";



// =============================================================================
//  WEAPON BUILDING BLOCKS  (used by the presets below; "0" = nothing)
// =============================================================================

//  Primary
    alias ak-47-t               "mp_t_default_primary weapon_ak47";
    alias ak-47-ct              "mp_ct_default_primary weapon_ak47";
    alias m4a4-t                "mp_t_default_primary weapon_m4a1";
    alias m4a4-ct               "mp_ct_default_primary weapon_m4a1";
    alias m4a1s-t               "mp_t_default_primary weapon_m4a1_silencer";
    alias m4a1s-ct              "mp_ct_default_primary weapon_m4a1_silencer";
    alias awp-t                 "mp_t_default_primary weapon_awp";
    alias awp-ct                "mp_ct_default_primary weapon_awp";
    alias scout-t               "mp_t_default_primary weapon_ssg08";
    alias scout-ct              "mp_ct_default_primary weapon_ssg08";
    alias nova-t                "mp_t_default_primary weapon_nova";
    alias nova-ct               "mp_ct_default_primary weapon_nova";
    alias strip-primary         "mp_t_default_primary 0; mp_ct_default_primary 0";

//  Secondary
    alias deagle-t              "mp_t_default_secondary weapon_deagle";
    alias deagle-ct             "mp_ct_default_secondary weapon_deagle";
    alias hkp2000-t             "mp_t_default_secondary weapon_hkp2000";
    alias hkp2000-ct            "mp_ct_default_secondary weapon_hkp2000";
    alias usp-t                 "mp_t_default_secondary weapon_usp_silencer";
    alias usp-ct                "mp_ct_default_secondary weapon_usp_silencer";
    alias glock-t               "mp_t_default_secondary weapon_glock";
    alias glock-ct              "mp_ct_default_secondary weapon_glock";
    alias tec9-t                "mp_t_default_secondary weapon_tec9";
    alias tec9-ct               "mp_ct_default_secondary weapon_tec9";
    alias strip-secondary       "mp_t_default_secondary 0; mp_ct_default_secondary 0";

//  Melee
    alias knife-t               "mp_t_default_melee weapon_knife";
    alias knife-ct              "mp_ct_default_melee weapon_knife";
    alias taser-t               "mp_t_default_melee weapon_taser";
    alias taser-ct              "mp_ct_default_melee weapon_taser";
    alias strip-melee           "mp_t_default_melee 0; mp_ct_default_melee 0";

//  Grenades
    alias hegrenade             "mp_t_default_grenades weapon_hegrenade; mp_ct_default_grenades weapon_hegrenade";
    alias flashbang             "mp_t_default_grenades weapon_flashbang; mp_ct_default_grenades weapon_flashbang";
    alias smokegrenade          "mp_t_default_grenades weapon_smokegrenade; mp_ct_default_grenades weapon_smokegrenade";
    alias strip-grenades        "mp_t_default_grenades 0; mp_ct_default_grenades 0";



// =============================================================================
//  WEAPON PRESETS  (take effect on the next round - run "startmatch" after)
// =============================================================================

    alias ak-47                 "ak-47-t; ak-47-ct; glock-t; glock-ct; strip-melee; strip-grenades; say [1v1] Preset: AK-47 + Glock";
    alias m4a4                  "m4a4-t; m4a4-ct; hkp2000-t; hkp2000-ct; strip-melee; strip-grenades; say [1v1] Preset: M4A4 + P2000";
    alias m4a1                  "m4a4";    // kept for compatibility with v1.0
    alias m4a1s                 "m4a1s-t; m4a1s-ct; usp-t; usp-ct; strip-melee; strip-grenades; say [1v1] Preset: M4A1-S + USP-S";
    alias awp                   "awp-t; awp-ct; strip-secondary; strip-melee; strip-grenades; say [1v1] Preset: AWP only";
    alias scoutknives           "scout-t; scout-ct; strip-secondary; knife-t; knife-ct; strip-grenades; say [1v1] Preset: Scouts + knives";
    alias deagles               "strip-primary; deagle-t; deagle-ct; strip-melee; strip-grenades; say [1v1] Preset: Deagles";
    alias usp                   "strip-primary; usp-t; usp-ct; strip-melee; strip-grenades; say [1v1] Preset: USP-S";
    alias johnwick              "strip-primary; usp-t; usp-ct; strip-melee; flashbang; say [1v1] Preset: John Wick (USP-S + flash)";



// =============================================================================
//  Apply settings
// =============================================================================
    mp_restartgame              3;


echo " ";
echo "  +--------------------------------------------------------------------+";
echo "  |  Counter-Strike 2 - 1v1 Configuration                  v2.0        |";
echo "  |  CS2 port of the 2019 CS:GO config by Denial                       |";
echo "  +--------------------------------------------------------------------+";
echo "  |  1. MODES (toggle)        |  2. WEAPON PRESETS                     |";
echo "  |     headshot              |     ak-47      AK-47 + Glock           |";
echo "  |     overtime              |     m4a4       M4A4 + P2000            |";
echo "  |     mapweapons            |     m4a1s      M4A1-S + USP-S          |";
echo "  |     infammo  (sv_cheats)  |     awp        AWP only                |";
echo "  |                           |     scoutknives  Scout + knife         |";
echo "  |  3. MATCH                 |     deagles    Desert Eagle            |";
echo "  |     startmatch            |     usp        USP-S                   |";
echo "  |     restartmatch          |     johnwick   USP-S + flashbang       |";
echo "  |     endwarmup             |                                        |";
echo "  |     pausematch            |  Presets apply next round:             |";
echo "  |     unpausematch          |  pick one, then type  startmatch       |";
echo "  +--------------------------------------------------------------------+";
echo " ";
